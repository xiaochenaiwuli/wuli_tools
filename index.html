<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MechSimulator - 测量工具模拟器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }

    header img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      color: #64748b;
      max-width: 600px;
      margin: 0 auto;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .tool-card {
      display: block;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: #2563eb;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
    }

    .card-img {
      width: 100%;
      padding: 2rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
    }

    .card-img img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .tool-card .card-body {
      padding: 1rem 1.5rem;
      text-align: center;
    }

    .tool-card h2 {
      font-size: 1.2rem;
      color: #1e293b;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      margin-top: auto;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.5rem; }
      .tools-grid { grid-template-columns: 1fr; }

    }
  </style>
</head>
<body>

  <header>
    <img src="ruler/assets/img/no_background_logo.png" alt="MechSimulator Logo">
    <h1>MechSimulator</h1>
    <p>交互式测量工具模拟器 — 钢尺、游标卡尺、螺旋测微器在线练习</p>
  </header>

  <main class="tools-grid">

    <a class="tool-card" href="ruler/steel-ruler-light-zh.html">
      <div class="card-img">
        <img src="icons/ruler.png" alt="钢尺模拟器">
      </div>
      <div class="card-body">
        <h2>钢尺模拟器</h2>
      </div>
    </a>

    <a class="tool-card" href="vernier/vernier-caliper-light-zh.html">
      <div class="card-img">
        <img src="icons/vernier_caliper.png" alt="游标卡尺模拟器">
      </div>
      <div class="card-body">
        <h2>游标卡尺模拟器</h2>
      </div>
    </a>

    <a class="tool-card" href="micrometer/screw-gauge-light-zh.html">
      <div class="card-img">
        <img src="icons/screw_gauge.png" alt="螺旋测微器模拟器">
      </div>
      <div class="card-body">
        <h2>螺旋测微器模拟器</h2>
      </div>
    </a>

  </main>

  <footer>
    MechSimulator &copy; 2026 &mdash; 测量工具在线练习平台
  </footer>

</body>
</html>
