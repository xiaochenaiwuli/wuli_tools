<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-soft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#bg)"/>

  <circle cx="60" cy="60" r="32" fill="url(#glow-soft)"/>

  <g fill="none" stroke-linecap="round" opacity="0.5">
    <ellipse cx="60" cy="60" rx="38" ry="14" transform="rotate(-60 60 60)" stroke="#93c5fd" stroke-width="1.8"/>
    <ellipse cx="60" cy="60" rx="38" ry="14" transform="rotate(0 60 60)"   stroke="#bfdbfe" stroke-width="1.8"/>
    <ellipse cx="60" cy="60" rx="38" ry="14" transform="rotate(60 60 60)"  stroke="#93c5fd" stroke-width="1.8"/>
  </g>

  <circle cx="60" cy="60" r="18" fill="url(#glow)" opacity="0.9"/>
  <circle cx="60" cy="60" r="7" fill="#fbbf24"/>
  <circle cx="60" cy="60" r="4" fill="#fef3c7"/>

  <circle cx="90" cy="42.6" r="3.5" fill="#60a5fa"/>
  <circle cx="30" cy="77.4" r="3.5" fill="#60a5fa"/>
  <circle cx="60" cy="22"   r="3.5" fill="#60a5fa"/>
</svg>
