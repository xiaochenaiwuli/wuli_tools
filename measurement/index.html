<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测量工具 — 悟理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
      color: #fff;
      padding: 2rem 1.5rem 1.8rem;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .breadcrumb a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.15s;
    }

    .breadcrumb a:hover { color: #fff; }

    .breadcrumb .sep { color: rgba(255,255,255,0.4); }

    .breadcrumb .current { color: rgba(255,255,255,0.95); font-weight: 500; }

    .page-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      color: rgba(255,255,255,0.8);
      font-size: 1rem;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .tool-card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: #2563eb;
      box-shadow: 0 10px 28px rgba(37,99,235,0.12);
    }

    .card-img {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 140px;
      background: #f8fafc;
    }

    .card-img img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .card-body {
      padding: 1.2rem 1.5rem 1.5rem;
    }

    .card-body h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.35rem;
    }

    .card-body p {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.5;
    }

    .card-arrow {
      margin-top: 0.75rem;
      font-size: 0.82rem;
      color: #2563eb;
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      margin-top: auto;
      color: #94a3b8;
      font-size: 0.85rem;
      border-top: 1px solid #e2e8f0;
    }

    footer a {
      color: #64748b;
      text-decoration: none;
    }

    footer a:hover { color: #2563eb; }

    @media (max-width: 480px) {
      .page-header h1 { font-size: 1.4rem; }
      .tools-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="header-inner">
      <nav class="breadcrumb">
        <a href="../index.html">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.4L1 7.5V14.5H6V10h4v4.5h5V7.5L8 1.4z"/></svg>
          悟理
        </a>
        <span class="sep">/</span>
        <span class="current">测量工具</span>
      </nav>
      <h1>测量工具</h1>
      <p>钢尺、游标卡尺、螺旋测微器 — 交互式模拟与读数练习</p>
    </div>
  </header>

  <main class="tools-grid">

    <a class="tool-card" href="../ruler/steel-ruler-light-zh.html">
      <div class="card-img">
        <img src="../icons/ruler.png" alt="钢尺模拟器">
      </div>
      <div class="card-body">
        <h2>钢尺模拟器</h2>
        <p>0–150 mm 刻度尺读数练习，掌握最小分度值与估读方法</p>
        <span class="card-arrow">开始练习 →</span>
      </div>
    </a>

    <a class="tool-card" href="../vernier/vernier-caliper-light-zh.html">
      <div class="card-img">
        <img src="../icons/vernier_caliper.png" alt="游标卡尺模拟器">
      </div>
      <div class="card-body">
        <h2>游标卡尺模拟器</h2>
        <p>交互式游标卡尺模拟，练习主尺与游标的对齐读数</p>
        <span class="card-arrow">开始练习 →</span>
      </div>
    </a>

    <a class="tool-card" href="../micrometer/screw-gauge-light-zh.html">
      <div class="card-img">
        <img src="../icons/screw_gauge.png" alt="螺旋测微器模拟器">
      </div>
      <div class="card-body">
        <h2>螺旋测微器模拟器</h2>
        <p>学习固定刻度与可动刻度的配合读数，精确到 0.01 mm</p>
        <span class="card-arrow">开始练习 →</span>
      </div>
    </a>

  </main>

  <footer>
    <a href="../index.html">悟理</a> &copy; 2026 &mdash; 高中物理仿真学习平台
  </footer>

</body>
</html>
